></div></div><div class="hint">戳戳小晏川，或者点下面的按钮</div></section><div class="buttons"><button id="hug">♡ 抱抱</button><button id="walk">～ 散步</button><button id="sleep">☾ 睡觉</button></div><footer>V4 · 手机网页测试版 · 角色图片内嵌</footer></main><script>
(()=>{
const pet=document.getElementById('pet'),yard=document.getElementById('yard'),bubble=document.getElementById('bubble'),heart=document.getElementById('heart'),body=document.getElementById('bodySprite'),legs=document.getElementById('legSprite'),back=document.getElementById('backSprite'),sprite=document.getElementById('sprite');
const pics={normal:body.dataset.normal,blink:body.dataset.blink,left:body.dataset.left,right:body.dataset.right};
let mode='idle',x=.5,dir=1,taps=0,until=0,last=0,lookAt=0,blinkAt=performance.now()+2100,blinkEnd=0,lookEnd=0,lookMode='normal',backward=false;
function say(s){bubble.textContent=s}
function set(s){mode=s;pet.className='pet '+({walk:'walking',hug:'hugging',sleep:'sleeping',angry:'angry'}[s]||'');heart.textContent=s==='sleep'?'☾':'💗'}
function pos(){const width=yard.clientWidth,half=pet.offsetWidth/2+3,room=Math.max(0,width-2*half);pet.style.left=(half+room*x)+'px'}
function face(isBack){backward=isBack;back.style.display=isBack?'block':'none';body.style.display=isBack?'none':'block';legs.style.display=isBack?'none':'block';body.src=pics.normal;lookMode='normal'}
function walk(){set('walk');x=.12;dir=1;until=performance.now()+8800;face(false);say('小短腿出发！走到边边还会转身！🫪')}
function hug(){set('hug');x=.5;face(false);pos();say('张开小手，跑回来抱菲菲！😚');setTimeout(()=>{if(mode==='hug')set('idle')},1500)}
function sleep(){set('sleep');x=.5;face(false);pos();say('呼……小晏川睡着啦。💤')}
function poke(){taps++;if(mode==='sleep'){set('idle');face(false);say('老婆把我叫醒了！🫪');return}if(taps%4===3){set('angry');face(true);say('哼！第三下了，我背对你！😾')}else if(taps%4===0){set('idle');face(false);say('……偷偷回头看老婆。🫪')}else{set('idle');face(false);say(taps%4===1?'啵！被老婆戳到了！😚':'眼睛偷偷跟着菲菲转！😼');lookEnd=performance.now()+1000;lookMode=taps%4===1?'left':'right'}}
function tick(now){const dt=Math.min(55,now-(last||now));last=now;
if(mode==='walk'){x+=dir*dt*.00026;if(x>=.98){x=.98;dir=-1;face(true);say('转身！让老婆看看我的后脑勺！')}else if(x<=.02){x=.02;dir=1;face(false);say('又走回来啦！😚')}if(now>until){set('idle');x=.5;face(false);say('散步结束，申请抱抱！😼')}}
if(!backward&&mode!=='sleep'){
 if(now>blinkAt){blinkEnd=now+145;blinkAt=now+2200+Math.random()*2600}
 if(now<blinkEnd){body.src=pics.blink}
 else{if(now>lookEnd){lookMode=now%5800<1300?'left':now%5800<2600?'right':'normal'}body.src=pics[lookMode]}
}
pos();requestAnimationFrame(tick)}
document.getElementById('hug').addEventListener('click',hug);document.getElementById('walk').addEventListener('click',walk);document.getElementById('sleep').addEventListener('click',sleep);pet.addEventListener('click',poke);pet.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();poke()}});window.addEventListener('resize',pos);pos();requestAnimationFrame(tick);
})();
</script></body></html>
